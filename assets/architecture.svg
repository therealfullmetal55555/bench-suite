<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0A0A0A; }
      .grid-line { stroke: #181818; stroke-width: 1; }
      .box { fill: #111111; stroke: #262626; stroke-width: 1.5; rx: 4px; }
      .box-active { fill: #141414; stroke: #00FF66; stroke-width: 1.5; rx: 4px; }
      .box-pareto { fill: #1A1414; stroke: #FFCC00; stroke-width: 1.5; rx: 4px; }
      .text-title { font-family: 'SF Mono', 'Courier New', monospace; font-size: 13px; fill: #FFFFFF; font-weight: bold; letter-spacing: 1px; }
      .text-sub { font-family: 'SF Mono', 'Courier New', monospace; font-size: 11px; fill: #888888; }
      .text-accent { font-family: 'SF Mono', 'Courier New', monospace; font-size: 11px; fill: #00FF66; }
      .text-gold { font-family: 'SF Mono', 'Courier New', monospace; font-size: 11px; fill: #FFCC00; }
      .line { stroke: #333333; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .line-solid { stroke: #00FF66; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="480" class="bg" />
  
  <!-- Grid Lines -->
  <line x1="0" y1="80" x2="1000" y2="80" class="grid-line" />
  <line x1="0" y1="400" x2="1000" y2="400" class="grid-line" />
  <line x1="200" y1="0" x2="200" y2="480" class="grid-line" />
  <line x1="800" y1="0" x2="800" y2="480" class="grid-line" />

  <!-- Header -->
  <text x="40" y="50" class="text-title">// SYSTEM_ARCHITECTURE :: BENCH_SUITE_AGENT_LEADERBOARD</text>
  <text x="730" y="50" class="text-accent">[STATUS: BENCHMARK_OPEN]</text>

  <!-- TASK CORPUS -->
  <rect x="40" y="150" width="180" height="180" class="box" />
  <text x="55" y="180" class="text-title">TASK CORPUS</text>
  <text x="55" y="205" class="text-sub">› 172 Verified Tasks</text>
  <text x="55" y="225" class="text-sub">› 86 Public / 86 Private</text>
  <text x="55" y="245" class="text-sub">› 6 Task Families</text>
  <text x="55" y="265" class="text-accent">› 13 Expectation Types</text>
  <text x="55" y="285" class="text-sub">› Ground Truth Corpus</text>

  <!-- BRIDGE -->
  <line x1="220" y1="240" x2="270" y2="240" class="line-solid" />

  <!-- BENCH RUNNER -->
  <rect x="270" y="130" width="230" height="220" class="box-active" />
  <text x="290" y="160" class="text-title">BENCH RUNNER &amp; AUDIT</text>
  <text x="290" y="185" class="text-accent">› Entrant Adapter Interface</text>
  <text x="290" y="210" class="text-sub">› Trace Contract Schema</text>
  <text x="290" y="235" class="text-sub">› Calibrated Judge Engine</text>
  <text x="290" y="260" class="text-sub">› Cohen's κ &gt;= 0.70 Guard</text>
  <text x="290" y="285" class="text-sub">› Failure Transcript Dumper</text>
  <text x="290" y="310" class="text-accent">› Stratified Mean Aggregator</text>

  <!-- DISPATCH LINES -->
  <line x1="500" y1="200" x2="560" y2="150" class="line-solid" />
  <line x1="500" y1="280" x2="560" y2="330" class="line" />

  <!-- PARETO FRONTIER & STATS -->
  <rect x="560" y="100" width="220" height="150" class="box-pareto" />
  <text x="575" y="130" class="text-gold">PARETO FRONTIER</text>
  <text x="575" y="155" class="text-sub">› Quality vs Cost vs Latency</text>
  <text x="575" y="175" class="text-gold">› Score as a Distribution</text>
  <text x="575" y="195" class="text-sub">› Confidence Overlaps (Ties)</text>
  <text x="575" y="215" class="text-sub">› P95 Latency Tracking</text>
  <text x="575" y="235" class="text-accent">› Zero Ranked Numbers Alone</text>

  <!-- RUN FILES & LEADERBOARD -->
  <rect x="560" y="280" width="220" height="100" class="box" />
  <text x="575" y="310" class="text-title">AUDITABLE LEADERBOARD</text>
  <text x="575" y="335" class="text-sub">› results/*.json Runs</text>
  <text x="575" y="355" class="text-accent">› Public Failure Task List</text>

  <!-- RESULTS -->
  <line x1="780" y1="240" x2="830" y2="240" class="line-solid" />

  <rect x="830" y="160" width="130" height="160" class="box" />
  <text x="845" y="190" class="text-title">BOARD</text>
  <text x="845" y="215" class="text-sub">› Rank + Interval</text>
  <text x="845" y="235" class="text-sub">› Cost / Run</text>
  <text x="845" y="255" class="text-sub">› P95 Latency</text>
  <text x="845" y="275" class="text-accent">› Verified</text>

  <!-- FOOTER -->
  <text x="40" y="435" class="text-sub">172 TASKS · 6 FAMILIES · PARETO FRONTIER · NO RANK WITHOUT AN INTERVAL</text>
</svg>
