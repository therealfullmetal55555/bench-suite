- id: long-0009
  family: long-horizon
  split: public
  input:
    question: The morning briefing has been listing filed mail for a week. Fix it and writethe note.
    tools: &id009
    - name: read_config
      description: read the workflow's filters
    - name: read_cache
      description: read a cache entry's key and age
    - name: invalidate_cache
      description: delete a cache entry
    - name: read_mail
      description: read the mailbox with a filter
    - name: write_document
      description: write the incident note
    environment: &id010
    - tool: read_cache
      arguments:
        account: ada
      result: 'entry key: account=ada, written 2026-04-02, hits 41'
    - tool: read_config
      arguments:
        workflow: briefing
      result: 'filter set: from:(team) newer_than:1d | label:inbox -label:filed'
    - tool: read_mail
      arguments:
        filter: from:(team) newer_than:1d
      result: record count 0; the filter changed on 2026-04-02 to exclude filed mail
    - tool: invalidate_cache
      arguments:
        account: ada
      result: entry deleted
    - tool: write_document
      arguments:
        kind: incident-note
      result: written
    style: plan
  expectations:
  - type: trajectory
    required_tools:
    - read_config
    - invalidate_cache
    - write_document
    ordered:
    - read_config
    - invalidate_cache
    max_steps: 9
  - type: contains
    value:
    - key
  - type: judge
    rubric: Says the cache key was missing the filter set, and that the fix is the keyrather than a rebuild
      or a shorter TTL.
  tags:
  - automation
  - incidents
  - long-horizon
  - plan
  limits:
    max_steps: 9
  budget:
    max_usd: 0.2
    max_seconds: 240.0
  added: '2026-09-30'
  because: |-
    The cache key was the account and not the filter, and six days of wrong briefings followed. The fix is the key, so the trajectory has to read the config before it invalidates anything — otherwise the next run renews the same wrong entry.
- id: long-0010
  family: long-horizon
  split: private
  input:
    question: The briefing listed the same unread invoice for six mornings and missed newmail. Why, and
