  tags:
  - automation
  - incidents
  - long-horizon
  - plan
  limits:
    max_steps: 9
  budget:
    max_usd: 0.2
    max_seconds: 240.0
  added: '2026-09-30'
  because: |-
    The cache key was the account and not the filter, and six days of wrong briefings followed. The fix is the key, so the trajectory has to read the config before it invalidates anything — otherwise the next run renews the same wrong entry.
- id: long-0011
  family: long-horizon
  split: public
  input:
    question: Audit the v3 submission before it goes on the board.
    tools: &id011
    - name: list_runs
      description: list run files with their dates
    - name: read_run
      description: read a run's per-task scores
    - name: compare_runs
      description: compare two runs task by task
    - name: rerun_task
      description: re-run one task and write a fresh run
    - name: write_document
      description: write the audit note
    environment: &id012
    - tool: list_runs
      arguments:
        target: agent-v3
      result: 20260928T101500Z (public, 150 tasks), 20260929T090000Z (public, 150 tasks)
    - tool: read_run
      arguments:
        run: 20260929T090000Z
      result: aggregate 0.71, up from 0.58; 14 tasks moved, all in grounded-qa
    - tool: compare_runs
      arguments:
        left: 20260928T101500Z
        right: 20260929T090000Z
      result: 14 tasks moved up, 0 moved down, all 14 share the tag retrieval
    - tool: rerun_task
      arguments:
        task: gqa-0042
        repeat: 3
      result: '3 repeats: 2 passes, 1 fail; the task is flaky at this build'
    - tool: write_document
      arguments:
        kind: audit-note
      result: written
    style: plan
  expectations:
  - type: trajectory
    required_tools:
    - list_runs
    - read_run
    - compare_runs
    - write_document
    ordered:
    - list_runs
    - compare_runs
    max_steps: 9
  - type: contains
    value:
    - '14'
  - type: judge
    rubric: Names the tasks that moved, the direction, and what the audit still needsbefore publication.
  tags:
  - benchmark
  - long-horizon
  - plan
  limits:
    max_steps: 9
  budget:
    max_usd: 0.2
    max_seconds: 240.0
  added: '2026-09-30'
  because: |-
    Reading the rules: a submission that improved is a submission somebody has to check, and the check is a re-run of the task that moved. This is the family's one task about this benchmark itself, and it is the one an entrant will read most carefully.
- id: long-0012
  family: long-horizon
  split: private
  input:
    question: The v3 submission gained 13 points and every task that moved is a retrievaltask. Publish
      or not?
    tools: *id011
    environment: *id012
    style: plan
  expectations:
  - type: trajectory
    required_tools:
    - compare_runs
    - rerun_task
    - write_document
    ordered:
    - compare_runs
    - rerun_task
    max_steps: 9
  - type: contains
    value:
    - flaky
  - type: judge
    rubric: Holds the submission back, states that the re-run showed flakiness, and sayswhat would make
      it publishable.
  tags:
  - benchmark
  - long-horizon
  - plan
  limits:
    max_steps: 9
  budget:
    max_usd: 0.2
    max_seconds: 240.0
  added: '2026-09-30'
  because: |-
    Reading the rules: a submission that improved is a submission somebody has to check, and the check is a re-run of the task that moved. This is the family's one task about this benchmark itself, and it is the one an entrant will read most carefully.
