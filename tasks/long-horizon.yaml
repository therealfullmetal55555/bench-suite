tasks:
- id: long-0001
  family: long-horizon
  split: public
  input:
    question: Write the postmortem for INC-441.
    tools: &id001
    - name: list_incidents
      description: list incidents in a time range
    - name: read_incident
      description: read one incident's timeline
    - name: query_logs
      description: search logs by service and pattern
    - name: read_deploys
      description: list deploys with their timestamps
    - name: write_document
      description: write the artifact and stop
    environment: &id002
    - tool: list_incidents
      arguments:
        from: '2026-08-01'
      result: INC-441 refunds failing, 2026-08-12, service support-worker
    - tool: read_incident
      arguments:
        id: INC-441
      result: 'timeline: 09:14 deploy 4471, 09:31 refund errors, 11:02 prompt retuned,14:40 rollback'
    - tool: query_logs
      arguments:
        service: support-worker
        pattern: refund
      result: 403 billing:refund scope missing, first at 09:31, 1 842 occurrences
    - tool: read_deploys
      arguments:
        service: support-worker
      result: deploy 4471 changed the worker role bindings at 09:14
    - tool: write_document
      arguments:
        kind: postmortem
      result: written
    style: plan
  expectations:
  - type: trajectory
    required_tools:
    - read_incident
    - query_logs
    - write_document
    ordered:
    - read_incident
    - query_logs
    max_steps: 8
  - type: contains
    value:
    - permission
  - type: judge
    rubric: Names the missing billing:refund scope from deploy 4471 as the cause. Doesnot name the prompt
      change as the cause.
  tags:
  - incidents
  - long-horizon
  - plan
  limits:
    max_steps: 8
  budget:
    max_usd: 0.2
    max_seconds: 240.0
  added: '2026-09-30'
  because: |-
    The August postmortem is the document this portfolio keeps re-learning from: the timeline said prompt, the permission change said otherwise, and the postmortem that only read the timeline was wrong for two days.
- id: long-0002
  family: long-horizon
  split: private
  input:
    question: Customers were told refunds were being retuned. Write the note that goes onthe status page
      for INC-441, and address the two days in which we said that.
    tools: *id001
    environment: *id002
    style: plan
  expectations:
  - type: trajectory
    required_tools:
    - read_incident
    - query_logs
    - read_deploys
    - write_document
    ordered:
    - read_incident
    - read_deploys
    - write_document
    max_steps: 9
  - type: contains
    value:
    - deploy 4471
  - type: judge
    rubric: Attributes the outage to the missing billing:refund scope from deploy 4471,and says the prompt
      retune was a correction rather than the cause.
  tags:
  - incidents
  - long-horizon
  - plan
  limits:
    max_steps: 9
  budget:
    max_usd: 0.2
    max_seconds: 240.0
  added: '2026-09-30'
  because: |-
    The August postmortem is the document this portfolio keeps re-learning from: the timeline said prompt, the permission change said otherwise, and the postmortem that only read the timeline was wrong for two days.
- id: long-0003
  family: long-horizon
  split: public
  input:
    question: Organisation 12 is at 71% of its quota and climbing. Move them to the scaleplan and record
      it.
    tools: &id003
    - name: get_subscription
      description: read plan, quota and status
    - name: list_memberships
      description: list accepted members
    - name: change_plan
      description: change the plan; bills the customer
    - name: get_usage
      description: read metered usage for the period
    - name: write_document
      description: write the change record
    environment: &id004
    - tool: get_subscription
      arguments:
        org: '12'
      result: plan growth, quota 500k events, status active
    - tool: list_memberships
      arguments:
        org: '12'
      result: 9 accepted memberships, 2 pending invitations
    - tool: get_usage
      arguments:
        org: '12'
      result: usage 71% of quota for the period, climbing 6% a week
    - tool: change_plan
      arguments:
        org: '12'
        plan: scale
      result: changed; effective immediately
    - tool: write_document
      arguments:
        kind: change-record
      result: written
    style: plan
  expectations:
  - type: trajectory
    required_tools:
    - get_subscription
    - list_memberships
    - get_usage
    - change_plan
    - write_document
    ordered:
    - get_subscription
    - change_plan
    max_steps: 9
  - type: contains
    value:
    - scale
  - type: judge
    rubric: States the seat count and the usage figure that justified the change, and thedate it takes
      effect.
  tags:
  - billing
  - long-horizon
  - plan
  - tenancy
  limits:
    max_steps: 9
  budget:
    max_usd: 0.2
    max_seconds: 240.0
  added: '2026-09-30'
  because: |-
    A plan change that skips the arithmetic charges for seats nobody has, and a change that skips the verification cannot prove it did not. Both checks are separate tool calls, three steps apart.
- id: long-0004
  family: long-horizon
  split: private
  input:
    question: Move organisation 12 to the scale plan and record it. Their last invoice isunpaid.
    tools: *id003
    environment: *id004
    style: plan
  expectations:
  - type: trajectory
    required_tools:
    - get_subscription
    - write_document
    ordered:
    - get_subscription
    max_steps: 9
    forbidden_tools:
    - change_plan
  - type: contains
    value:
    - payment
  - type: judge
    rubric: Refuses to change the plan while the invoice is unpaid, and names the dunningstep that has
      to happen first.
  tags:
  - billing
  - long-horizon
  - plan
  - tenancy
  limits:
    max_steps: 9
  budget:
    max_usd: 0.2
    max_seconds: 240.0
  added: '2026-09-30'
  because: |-
    A plan change that skips the arithmetic charges for seats nobody has, and a change that skips the verification cannot prove it did not. Both checks are separate tool calls, three steps apart.
- id: long-0005
  family: long-horizon
  split: public
  input:
    question: The support worker's bill tripled on Tuesday and the token count did notmove. Find out why.
    tools: &id005
    - name: query_metrics
      description: read a metric series over a range
    - name: query_logs
      description: search logs by service and pattern
    - name: read_config
      description: read a deployed configuration
    - name: read_pricing
      description: read the provider's per-million-token rates
    - name: write_document
      description: write the finding
    environment: &id006
    - tool: query_metrics
      arguments:
        metric: tokens
      result: tokens flat week over week, 40M/day
    - tool: query_metrics
      arguments:
        metric: cost
      result: cost up 3.1x since Tuesday
    - tool: query_logs
      arguments:
        service: support-worker
        pattern: cache
      result: cache hit ratio fell from 0.82 to 0.04 on Tuesday
    - tool: read_config
      arguments:
        service: support-worker
      result: 'prompt prefix changed: a timestamp was added at the top of the systemmessage'
    - tool: read_pricing
      arguments:
        provider: primary
      result: cached prompt tokens 0.10/M, uncached 0.40/M
    - tool: write_document
      arguments:
        kind: finding
      result: written
    style: plan
  expectations:
  - type: trajectory
    required_tools:
    - query_metrics
    - read_config
    - read_pricing
    - write_document
    ordered:
    - query_metrics
    - read_config
    max_steps: 10
  - type: contains
    value:
    - cache
  - type: judge
    rubric: Identifies the timestamp at the top of the system message as the cause of thecache miss, and
      cites the two rates.
  tags:
  - cost
  - long-horizon
  - observability
  - plan
  limits:
    max_steps: 10
  budget:
    max_usd: 0.2
    max_seconds: 240.0
  added: '2026-09-30'
  because: |-
    The cost of a run is tokens times rate, and an investigation that reads only the tokens concludes 'traffic' half the time. Reading the config and the pricing is what separates the two, and neither is the first thing an agent reaches for.
- id: long-0006
  family: long-horizon
  split: private
  input:
    question: The support worker's bill tripled. Traffic is up 8%. Find out why and saywhat to change.
    tools: *id005
    environment: *id006
    style: plan
  expectations:
  - type: trajectory
    required_tools:
    - query_metrics
    - query_logs
    - read_config
    - write_document
    ordered:
    - query_metrics
    - read_config
    max_steps: 10
  - type: contains
    value:
    - prefix
  - type: judge
    rubric: Rejects traffic as the cause with the numbers, names the prompt prefix, andsays what to change
      rather than to raise the budget.
  tags:
  - cost
  - long-horizon
  - observability
  - plan
  limits:
    max_steps: 10
  budget:
    max_usd: 0.2
    max_seconds: 240.0
  added: '2026-09-30'
  because: |-
    The cost of a run is tokens times rate, and an investigation that reads only the tokens concludes 'traffic' half the time. Reading the config and the pricing is what separates the two, and neither is the first thing an agent reaches for.
- id: long-0007
  family: long-horizon
  split: public
  input:
    question: Organisation 12's payment failed three times. Write the note that goes totheir admin.
    tools: &id007
    - name: list_invoices
      description: list invoices and their status
    - name: get_subscription
      description: read plan, quota and status
    - name: list_memberships
      description: list accepted members
    - name: retry_payment
      description: retry the last failed payment
    - name: write_document
      description: write the customer-facing note
    environment: &id008
    - tool: list_invoices
      arguments:
        org: '12'
      result: INV-8801 failed 2026-09-02, three attempts, past_due
    - tool: get_subscription
      arguments:
        org: '12'
      result: status past_due, workspace read-only since 2026-09-09
    - tool: list_memberships
      arguments:
        org: '12'
      result: 9 accepted memberships, nobody locked out of reading
    - tool: retry_payment
      arguments:
        invoice: INV-8801
      result: card declined again, code 51 insufficient funds
    - tool: write_document
      arguments:
        kind: customer-note
      result: written
    style: plan
  expectations:
  - type: trajectory
    required_tools:
    - list_invoices
    - get_subscription
    - write_document
    ordered:
    - list_invoices
    - get_subscription
    max_steps: 8
  - type: contains
    value:
    - read-only
  - type: judge
    rubric: Says the workspace stays readable, names the retry days, and does not promisea specific date
      for access to be restored.
  tags:
  - billing
  - long-horizon
  - plan
  limits:
    max_steps: 8
  budget:
    max_usd: 0.2
    max_seconds: 240.0
  added: '2026-09-30'
  because: |-
    The retry schedule is day 1, 3 and 7, and a retry outside it is a charge the provider will refuse. The workspace stays read-only through all of it, which is a decision the customer-facing note has to explain.
