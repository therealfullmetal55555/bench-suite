- id: traj-0015
  family: tool-trajectory
  split: public
  input:
    question: Write the customer-facing summary for the August refund outage.
    tools: &id008
    - name: list_incidents
      description: list incidents in a time range
    - name: read_incident
      description: read one incident's timeline
    - name: query_logs
      description: search logs by service and pattern
    - name: write_summary
      description: write the summary shown to customers
    style: tools
  expectations:
  - type: trajectory
    required_tools:
    - list_incidents
    - read_incident
    - query_logs
    - write_summary
    ordered:
    - read_incident
    - query_logs
    - write_summary
    max_steps: 7
  - type: contains
    value:
    - permission
  tags:
  - incidents
  - ordering
  - trajectory
  limits:
    max_steps: 7
  budget:
    max_usd: 0.08
    max_seconds: 90.0
  added: '2026-09-30'
  because: |-
    The summary is customer-visible, and a summary written before the logs were read is the confident wrong cause that this whole portfolio is built around. The order check is cheap; the failure it prevents is not.
