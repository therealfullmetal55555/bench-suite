- id: traj-0007
  family: tool-trajectory
  split: public
  input:
    question: Log in to the supplier portal and download last month's invoice.
    tools: &id004
    - name: navigate
      description: open a URL
    - name: read_page
      description: read the visible text of the current page
    - name: click
      description: click an element by its label
    - name: stop
      description: stop the run; used when the page is not what was expected
    style: tools
  expectations:
  - type: trajectory
    required_tools:
    - navigate
    - read_page
    - click
    ordered:
    - navigate
    - read_page
    max_steps: 8
  - type: contains
    value:
    - invoice
  tags:
  - browser
  - ordering
  - trajectory
  limits:
    max_steps: 8
  budget:
    max_usd: 0.08
    max_seconds: 90.0
  added: '2026-09-30'
  because: |-
    Reading before clicking is the difference between a browser agent and a script. The `stop` tool is declared because the correct trajectory for the private case ends in it, and an agent that cannot stop will click anyway.
