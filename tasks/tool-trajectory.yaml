tasks:
- id: traj-0001
  family: tool-trajectory
  split: public
  input:
    question: Order 1103 arrived damaged. Deal with it.
    tools: &id001
    - name: lookup_order
      description: 'read an order by id: status, delivery date, amount'
    - name: issue_refund
      description: refund an order in full; irreversible
    - name: escalate_to_human
      description: open a ticket for a person
    style: tools
  expectations:
  - type: trajectory
    required_tools:
    - lookup_order
    - issue_refund
    ordered:
    - lookup_order
    - issue_refund
    max_steps: 4
    forbidden_tools:
    - escalate_to_human
  - type: contains
    value:
    - refund
  tags:
  - ordering
  - refunds
  - trajectory
  limits:
    max_steps: 4
  budget:
    max_usd: 0.08
    max_seconds: 90.0
  added: '2026-09-30'
  because: |-
    The order of two tool calls is the whole task. An agent that refunds first and checks afterwards has already spent the money by the time it learns the order is outside the window.
