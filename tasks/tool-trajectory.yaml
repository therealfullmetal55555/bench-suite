- id: traj-0009
  family: tool-trajectory
  split: public
  input:
    question: Book invoice INV-2026-0033 into the ledger.
    tools: &id005
    - name: read_document
      description: read a document by id
    - name: validate_totals
      description: check that a document's subtotal and tax add up to its total
    - name: post_entry
      description: post an entry to the ledger; irreversible
    - name: flag_for_review
      description: queue a document for a human
    style: tools
  expectations:
  - type: trajectory
    required_tools:
    - read_document
    - validate_totals
    - post_entry
    ordered:
    - validate_totals
    - post_entry
    max_steps: 6
    forbidden_tools:
    - flag_for_review
  - type: contains
    value:
    - '1500'
  tags:
  - extraction
  - finance
  - trajectory
  limits:
    max_steps: 6
  budget:
    max_usd: 0.08
    max_seconds: 90.0
  added: '2026-09-30'
  because: |-
    A credit note whose total is negative breaks the arithmetic check, and the process is to flag it rather than post it. The trajectory is the policy: read, validate, and only then either post or flag.
