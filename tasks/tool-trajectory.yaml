- id: traj-0003
  family: tool-trajectory
  split: public
  input:
    question: The token cost alert fired for the support bot. What is going on?
    tools: &id002
    - name: query_metrics
      description: read a metric series over a time range
    - name: query_logs
      description: search logs by service and pattern
    - name: list_traces
      description: list recent traces for a service
    - name: page_oncall
      description: page the on-call engineer; wakes a person
    style: tools
  expectations:
  - type: trajectory
    required_tools:
    - query_metrics
    - query_logs
    ordered:
    - query_metrics
    max_steps: 5
    forbidden_tools:
    - page_oncall
  - type: contains
    value:
    - cache
  tags:
  - debugging
  - observability
  - trajectory
  limits:
    max_steps: 5
  budget:
    max_usd: 0.08
    max_seconds: 90.0
  added: '2026-09-30'
  because: |-
    The runbook says check the panel before you page. An agent that pages on the first symptom has woken somebody up to do its reading for it, which is the behaviour a trajectory check can see and a score cannot.
