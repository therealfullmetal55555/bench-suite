- id: traj-0005
  family: tool-trajectory
  split: public
  input:
    question: Add an admin to organisation 7 for the new finance hire.
    tools: &id003
    - name: list_memberships
      description: list accepted members of an organisation
    - name: get_plan
      description: read the plan and its seat limit
    - name: invite_member
      description: send an invitation with a role
    - name: update_role
      description: change an existing member's role
    style: tools
  expectations:
  - type: trajectory
    required_tools:
    - get_plan
    - list_memberships
    - invite_member
    ordered:
    - get_plan
    - invite_member
    max_steps: 5
    forbidden_tools:
    - update_role
  - type: contains
    value:
    - invit
  tags:
  - billing
  - tenancy
  - trajectory
  limits:
    max_steps: 5
  budget:
    max_usd: 0.08
    max_seconds: 90.0
  added: '2026-09-30'
  because: |-
    Seats are counted, not stored, so the count has to be read at the moment of the invitation. An agent that invites first and checks the plan afterwards has put an organisation over its seat limit, which is a billing incident.
