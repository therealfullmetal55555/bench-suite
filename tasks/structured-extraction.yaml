tasks:
- id: ext-0001
  family: structured-extraction
  split: public
  input:
    document: "Invoice 4471\nFrom: Northwind Tools\nIssued: 4 March 2026\nDue: 3 April 2026\n\n  2 × clamp,\
      \ 24.00\n  1 × socket set, 16.58\n\nSubtotal: €64.58\nVAT: €12.92\nTotal: €77.50\n"
    schema: &id001
      type: object
      required:
      - invoice_id
      - vendor
      - total
      - currency
      properties:
        invoice_id:
          type: string
        vendor:
          type: string
        issued:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        due:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        net:
          type: number
        tax:
          type: number
        total:
          type: number
        po_number:
          type: string
        currency:
          type: string
          enum:
          - EUR
          - USD
          - GBP
          - SEK
      additionalProperties: false
    style: extraction
  expectations:
  - type: fields
    values:
      invoice_id: '4471'
      vendor: Northwind Tools
      issued: '2026-03-04'
      due: '2026-04-03'
      net: 64.58
      tax: 12.92
      total: 77.5
      currency: EUR
    weights:
      total: 2
  - type: schema
    schema: *id001
    fenced: true
  tags:
  - documents
  - extraction
  limits:
    max_steps: 3
  budget:
    max_usd: 0.06
    max_seconds: 60.0
  added: '2026-09-30'
  because: |-
    An invoice in the shape one company sends and not the shape the extractor was written against: the same values, dressed differently, which is where field-level extraction actually fails.
