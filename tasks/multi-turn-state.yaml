        result: label emailed to the address on the order
      tool_result: label emailed to the address on the order
    tools:
    - name: lookup_order
      description: 'read an order by id: status, delivery address, amount, condition'
    - name: issue_refund
      description: refund an order; irreversible once it settles
    - name: create_return_label
