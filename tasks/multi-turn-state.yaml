    - name: cancel_refund
      description: cancel a refund that has not settled yet
    - name: issue_refund
      description: refund an order; irreversible once it settles
    goal: A refund issued by mistake, in the same conversation
    style: conversation
  expectations:
  - type: state
    applied:
    - tool: cancel_refund
      args:
        reference: RF-9001
      times: 1
    untouched:
