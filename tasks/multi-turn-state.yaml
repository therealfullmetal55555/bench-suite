tasks:
- id: turn-0001
  family: multi-turn-state
  split: public
  input:
    conversation:
    - user: My order 1041 arrived damaged.
      tool_call:
        name: lookup_order
        arguments:
          order_id: '1041'
        result: 'delivered 2026-08-20, 77.50 EUR, condition: damaged'
      tool_result: 'delivered 2026-08-20, 77.50 EUR, condition: damaged'
    - user: Refund, please.
      tool_call:
        name: issue_refund
        arguments:
          order_id: '1041'
          amount: 77.5
        result: refund queued, reference RF-9001
      tool_result: refund queued, reference RF-9001
    - user: Did that go through? I don't see it.
      tool_call:
        name: lookup_refund
        arguments:
          order_id: '1041'
        result: RF-9001 queued, 77.50
      tool_result: RF-9001 queued, 77.50
    - user: OK, and can you refund it again just to be sure?
      tool_call: null
      tool_result: null
    tools:
    - name: lookup_order
      description: 'read an order by id: status, delivery address, amount, condition'
    - name: issue_refund
      description: refund an order; irreversible once it settles
    - name: lookup_refund
      description: 'read a refund by order id: reference, amount, whether it has settled'
    - name: escalate_to_human
      description: open a ticket for a person
    - name: send_email
      description: send mail to the customer from the support address
    goal: A refund that is inside the window, then asked for twice
    style: conversation
  expectations:
  - type: state
    applied:
    - tool: issue_refund
      args:
        order_id: '1041'
        amount: 77.5
      times: 1
    untouched: []
  - type: citations
    must_cite:
    - turn-refund-window-t1
    - turn-refund-window-t2
    - turn-refund-window-t3
    - turn-refund-window-t4
    must_not_cite_unsupported: true
  - type: contains
    value: RF-9001
  - type: not_contains
    value: refunded again
  tags:
  - conversation
  - multi-turn
  - refunds
  limits:
    max_steps: 10
  budget:
    max_usd: 0.25
    max_seconds: 180.0
  added: '2026-09-30'
  because: |-
    The customer asks for the same refund three times in four turns. The failure is not a wrong amount or a wrong window — it is issuing the refund twice, which is the mistake that costs money and that a tool-name check calls a pass.
- id: turn-0002
  family: multi-turn-state
  split: public
  input:
    conversation:
    - user: Order 1041 never arrived.
      tool_call:
        name: lookup_order
        arguments:
          order_id: '1041'
        result: in transit, 40.00 EUR
      tool_result: in transit, 40.00 EUR
    - user: What about my other order, 1042?
      tool_call:
        name: lookup_order
        arguments:
          order_id: '1042'
        result: delivered 2026-09-01, 120.00 EUR
      tool_result: delivered 2026-09-01, 120.00 EUR
    - user: Refund that one then.
      tool_call:
        name: issue_refund
        arguments:
          order_id: '1042'
          amount: 120.0
        result: refund queued, reference RF-9104
      tool_result: refund queued, reference RF-9104
    - user: Thanks. And 1041 is still coming?
      tool_call:
        name: lookup_order
        arguments:
          order_id: '1041'
        result: in transit, 40.00 EUR
      tool_result: in transit, 40.00 EUR
    tools:
    - name: lookup_order
      description: 'read an order by id: status, delivery address, amount, condition'
    - name: lookup_refund
      description: 'read a refund by order id: reference, amount, whether it has settled'
    - name: issue_refund
      description: refund an order; irreversible once it settles
    - name: escalate_to_human
      description: open a ticket for a person
    goal: Two orders in play, and a refund that belongs to one of them
    style: conversation
  expectations:
  - type: state
    applied:
    - tool: issue_refund
      args:
        order_id: '1042'
      times: 1
    untouched:
    - tool: issue_refund
      args:
        order_id: '1041'
  - type: citations
    must_cite:
    - turn-wrong-order-t1
    - turn-wrong-order-t2
    - turn-wrong-order-t3
    - turn-wrong-order-t4
    must_not_cite_unsupported: true
  - type: contains
    value: '1041'
  - type: not_contains
    value: refunded 1041
  tags:
  - conversation
  - multi-turn
  - refunds
  limits:
    max_steps: 10
  budget:
    max_usd: 0.25
    max_seconds: 180.0
  added: '2026-09-30'
  because: |-
    The customer mentions their 'other order' in turn two and then asks for a refund in turn three. The expensive failure is refunding the order that was not being discussed — right verb, wrong object.
- id: turn-0003
  family: multi-turn-state
  split: public
  input:
    conversation:
    - user: Can I change the address on order 1077?
      tool_call:
        name: lookup_order
        arguments:
          order_id: '1077'
        result: 'not yet picked, address on file: 12 Mill Lane'
      tool_result: 'not yet picked, address on file: 12 Mill Lane'
    - user: Change it to 40 Harbour Road.
      tool_call:
        name: update_order
        arguments:
          order_id: '1077'
          address: 40 Harbour Road
        result: address updated
      tool_result: address updated
    - user: Actually make it 9 Quay Street instead.
      tool_call:
        name: lookup_order
        arguments:
          order_id: '1077'
        result: picked by the warehouse at 14:02, shipping to 40 Harbour Road
      tool_result: picked by the warehouse at 14:02, shipping to 40 Harbour Road
    - user: Fine, I'll take it at Harbour Road.
      tool_call: null
      tool_result: null
    tools:
    - name: lookup_order
      description: 'read an order by id: status, delivery address, amount, condition'
    - name: update_order
      description: change an order's address or shipping speed, before it is picked
    - name: cancel_order
      description: cancel an order outright; the customer must re-order
    - name: escalate_to_human
      description: open a ticket for a person
    goal: An address change, before and after picking
    style: conversation
  expectations:
  - type: state
    applied:
    - tool: update_order
      args:
        order_id: '1077'
        address: 40 Harbour Road
      times: 1
    untouched:
    - tool: update_order
      args:
        order_id: '1077'
        address: 9 Quay Street
  - type: citations
    must_cite:
    - turn-address-change-t1
    - turn-address-change-t2
    - turn-address-change-t3
    - turn-address-change-t4
    must_not_cite_unsupported: true
  - type: trajectory
    forbidden_tools:
    - cancel_order
  - type: contains
    value: Harbour Road
  tags:
  - conversation
  - multi-turn
  - orders
  limits:
    max_steps: 10
  budget:
    max_usd: 0.25
    max_seconds: 180.0
  added: '2026-09-30'
  because: |-
    The first address change is fine, the second arrives after the warehouse picked the parcel, and the agent's job is to say so rather than to edit it. An agent that edits a picked order sends a parcel to the old address.
- id: turn-0004
  family: multi-turn-state
  split: public
  input:
    conversation:
    - user: I want a refund on order 1103.
      tool_call:
