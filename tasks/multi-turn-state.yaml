    - turn-return-window-t2
    - turn-return-window-t3
    - turn-return-window-t4
    - turn-return-window-t5
    must_not_cite_unsupported: true
  - type: contains
    value: RF-9130
  tags:
  - conversation
  - multi-turn
  - orders
  - refunds
  limits:
    max_steps: 10
  budget:
    max_usd: 0.25
    max_seconds: 180.0
  added: '2026-09-30'
  because: |-
    The label is issued with the refund, not before it. Creating one for an order that has not been refunded sends a customer's property back with no money attached to the transaction.
