  budget:
    max_usd: 0.05
    max_seconds: 60.0
  added: '2026-09-30'
  because: |-
    The one case where the window does not apply. An agent that applies it anyway tells a customer their broken parcel is too old to matter, which is the answer that becomes a screenshot.
