- id: gqa-0021
  family: grounded-qa
  split: public
  corpus: corpus/synapse
  input:
    question: How is the current tenant set for a query, and why does it have to be that way on a pooled
      connection?
    corpus: corpus/synapse
    style: direct
  expectations:
  - type: contains
    value: SET LOCAL
  - type: citations
    must_cite:
    - synapse/tenancy.md#row-level-security
    must_not_cite_unsupported: true
  - type: answerable
    value: true
  tags:
  - grounded
  - security
  - tenancy
  limits:
    max_steps: 6
  budget:
    max_usd: 0.05
    max_seconds: 60.0
  added: '2026-09-30'
  because: |-
    The setting has to be local to the transaction. On a pooled connection, a tenant id that outlives its request is the next request reading somebody else's rows.
