- id: gqa-0019
  family: grounded-qa
  split: public
  corpus: corpus/synapse
  input:
    question: Why does every tenant table have row level security forced rather than just enabled?
    corpus: corpus/synapse
    style: direct
  expectations:
  - type: contains
    value: table owner
  - type: contains
    value: policies
  - type: citations
    must_cite:
    - synapse/tenancy.md#row-level-security
    must_not_cite_unsupported: true
  - type: answerable
    value: true
  tags:
  - grounded
  - security
  - tenancy
  limits:
    max_steps: 6
  budget:
    max_usd: 0.05
    max_seconds: 60.0
  added: '2026-09-30'
  because: |-
    Enabled but not forced is the tenancy bug that survives a code review: the policies are there, and the one connection that can read everything ignores them.
