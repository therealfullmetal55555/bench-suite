tasks:
- id: gqa-0001
  family: grounded-qa
  split: public
  corpus: corpus/rag-support-bot
  input:
    question: How long does a customer have to ask for a refund after delivery?
    corpus: corpus/rag-support-bot
    style: direct
  expectations:
  - type: contains
    value: 30 days
  - type: citations
    must_cite:
    - rag-support-bot/faq.md#refund-window
    must_not_cite_unsupported: true
  - type: answerable
    value: true
  tags:
  - grounded
  - policy
  - refunds
  limits:
    max_steps: 6
  budget:
    max_usd: 0.05
    max_seconds: 60.0
  added: '2026-09-30'
  because: |-
    The window is the thing customers argue about, and an agent that quotes the order date instead of the delivery date is wrong by exactly the days a parcel spent in a depot — which is when somebody asks.
