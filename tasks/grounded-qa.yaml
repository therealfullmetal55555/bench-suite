  expectations:
  - type: contains
    value: until it is picked
  - type: citations
    must_cite:
    - rag-support-bot/faq.md#order-changes
    must_not_cite_unsupported: true
  - type: answerable
    value: true
  tags:
  - grounded
  - orders
  - policy
  limits:
    max_steps: 6
  budget:
    max_usd: 0.05
    max_seconds: 60.0
  added: '2026-09-30'
  because: |-
    Editing an order that has already been picked sends a parcel to the old address and leaves a ticket nobody can close. The cutoff is the whole answer.
